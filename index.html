<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="tel"],
        input[type="email"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-group label {
            font-weight: normal;
            display: inline;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Display Page Styling */
        #displayPage {
            display: none;
        }
        .result-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .result-item strong {
            color: #333;
        }
        .back-btn {
            background-color: #6c757d;
            margin-top: 20px;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Form Page -->
        <div id="formPage">
            <h2>User Registration Form</h2>
            <form id="userForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" required> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number:</label>
                    <input type="tel" id="mobile" required pattern="[0-9]{10}" placeholder="10-digit mobile number">
                </div>

                <div class="form-group">
                    <label for="email">Email ID:</label>
                    <input type="email" id="email" required placeholder="example@domain.com">
                </div>

                <div class="form-group">
                    <label for="city">City:</label>
                    <input type="text" id="city" required placeholder="Enter your city">
                </div>

                <div class="form-group">
                    <label for="state">State:</label>
                    <input type="text" id="state" required placeholder="Enter your state">
                </div>

                <div class="form-group">
                    <label for="country">Country:</label>
                    <input type="text" id="country" required placeholder="Enter your country">
                </div>

                <button type="submit">Submit & View</button>
            </form>
        </div>

        <!-- Display Page -->
        <div id="displayPage">
            <h2>Submitted Information</h2>
            <div class="result-item"><strong>Name:</strong> <span id="resName"></span></div>
            <div class="result-item"><strong>Gender:</strong> <span id="resGender"></span></div>
            <div class="result-item"><strong>Mobile Number:</strong> <span id="resMobile"></span></div>
            <div class="result-item"><strong>Email ID:</strong> <span id="resEmail"></span></div>
            <div class="result-item"><strong>City:</strong> <span id="resCity"></span></div>
            <div class="result-item"><strong>State:</strong> <span id="resState"></span></div>
            <div class="result-item"><strong>Country:</strong> <span id="resCountry"></span></div>

            <button class="back-btn" onclick="goBack()">Go Back</button>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            // Prevent the default form submission (page refresh)
            event.preventDefault();

            // Fetch values from the form elements
            const name = document.getElementById('name').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const mobile = document.getElementById('mobile').value;
            const email = document.getElementById('email').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const country = document.getElementById('country').value;

            // Populate the display page elements
            document.getElementById('resName').textContent = name;
            document.getElementById('resGender').textContent = gender;
            document.getElementById('resMobile').textContent = mobile;
            document.getElementById('resEmail').textContent = email;
            document.getElementById('resCity').textContent = city;
            document.getElementById('resState').textContent = state;
            document.getElementById('resCountry').textContent = country;

            // Switch views: Hide form, show display section
            document.getElementById('formPage').style.display = 'none';
            document.getElementById('displayPage').style.display = 'block';
        }

        function goBack() {
            // Reset the form and switch views back
            document.getElementById('userForm').reset();
            document.getElementById('displayPage').style.display = 'none';
            document.getElementById('formPage').style.display = 'block';
        }
    </script>

</body>
</html>
